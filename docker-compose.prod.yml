services:
  shinycleany-preview:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shinycleany-preview
    restart: unless-stopped
    networks:
      - proxy_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net
      - traefik.http.routers.shinycleany-preview.rule=Host(`shinycleany.preview.nayagrowth.com`) || Host(`shinycleany.com`) || Host(`www.shinycleany.com`)
      - traefik.http.routers.shinycleany-preview.entrypoints=websecure
      - traefik.http.routers.shinycleany-preview.tls.certresolver=letsencrypt
      - traefik.http.services.shinycleany-preview.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy_net:
    external: true
